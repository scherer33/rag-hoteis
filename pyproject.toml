[project]
name = "hotel-rag-algarve"
version = "0.1.0"
description = "RAG portfolio project over an Algarve hotel's operational procedures"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2",
    "python-frontmatter>=1.1",
    "pyyaml>=6",
    "qdrant-client>=1.12",
    "rank-bm25>=0.2",
    "openai>=1.40",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "streamlit>=1.39",
]

[project.optional-dependencies]
ml = ["sentence-transformers>=3"]
eval = ["ragas>=0.2"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hotel_rag"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: tests that need local models or running services"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
