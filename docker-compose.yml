name: hotel-rag

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      target: runtime
    env_file:
      - path: .env
        required: false
    environment:
      QDRANT_URL: http://qdrant:6333
      HF_HOME: /models
    ports:
      - "8000:8000"
    volumes:
      - model_cache:/models
    depends_on:
      qdrant:
        condition: service_healthy

  ui:
    build:
      context: .
      target: runtime
    env_file:
      - path: .env
        required: false
    environment:
      QDRANT_URL: http://qdrant:6333
      API_URL: http://api:8000
      HF_HOME: /models
    command: ["streamlit", "run", "ui/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    volumes:
      - model_cache:/models
    depends_on:
      - api

  dev:
    build:
      context: .
      target: dev
    env_file:
      - path: .env
        required: false
    environment:
      QDRANT_URL: http://qdrant:6333
      HF_HOME: /models
    volumes:
      - .:/app
      - model_cache:/models
    depends_on:
      qdrant:
        condition: service_healthy
    command: ["pytest", "-m", "not integration"]

  # Optional GPU variant: docker compose --profile gpu up api-gpu
  api-gpu:
    profiles: ["gpu"]
    build:
      context: .
      target: runtime
    env_file:
      - path: .env
        required: false
    environment:
      QDRANT_URL: http://qdrant:6333
      HF_HOME: /models
    ports:
      - "8000:8000"
    volumes:
      - model_cache:/models
    depends_on:
      qdrant:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  qdrant_data:
  model_cache:
