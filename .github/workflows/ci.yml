name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -m "not integration"

  docker:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate compose file
        run: docker compose config -q
      - name: Build the canonical dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dev
          load: true
          tags: hotel-rag-dev:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run tests in the canonical image
        run: docker run --rm hotel-rag-dev:ci pytest -m "not integration"

  eval-gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'eval')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - name: Check the committed retrieval report against thresholds
        run: uv run python scripts/check_eval_threshold.py results/latest.json config/eval_thresholds.json
